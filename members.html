
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGWLAD | Member Registration</title>
<link rel="stylesheet" href="style.css">

<style>
.member-page {
    max-width: 850px;
    width: 100%;
    margin: 25px auto;
    padding: 20px;
}
.member-header {
    background: #1769aa;
    color: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
}
.member-form {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
}
.member-form h3 {
    color: #1769aa;
    margin: 22px 0 12px;
}
.member-form label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}
.member-form input,
.member-form select,
.member-form textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d5dfea;
    border-radius: 7px;
    background: white;
}
.member-form button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #1769aa;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}
#memberMessage {
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>
<main class="member-page">

<header class="member-header">
    <h2>WGWLAD</h2>
    <p>Member Registration</p>
</header>

<form id="memberForm" class="member-form">

    <h2>New Member Registration</h2>

    <h3>1. Personal Information</h3>

    <label>First Name *</label>
    <input type="text" id="first_name" required>

    <label>Father Name *</label>
    <input type="text" id="father_name" required>

    <label>Grandfather Name</label>
    <input type="text" id="grandfather_name">

    <label>Gender *</label>
    <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <label>Date of Birth</label>
    <input type="date" id="birth_date">

    <label>Phone Number</label>
    <input type="tel" id="phone">

    <label>Address</label>
    <textarea id="address" rows="2"></textarea>

    <h3>2. Christian Life Information</h3>

    <label>Date Accepted Jesus Christ</label>
    <input type="date" id="accepted_christ_date">

    <label>Baptism Date</label>
    <input type="date" id="baptism_date">

    <h3>3. Family Information</h3>

    <label>Marital Status</label>
    <select id="marital_status">
        <option value="">Select Status</option>
        <option value="Single">Single</option>
        <option value="Married">Married</option>
        <option value="Divorced">Divorced</option>
        <option value="Widowed">Widowed</option>
    </select>

    <label>Number of Children</label>
    <input type="number" id="number_of_children" min="0" value="0">

    <label>Family Relationship</label>
    <select id="relationship">
        <option value="">Select Relationship</option>
        <option value="Husband">Husband</option>
        <option value="Wife">Wife</option>
        <option value="Son">Son</option>
        <option value="Daughter">Daughter</option>
        <option value="Brother">Brother</option>
        <option value="Sister">Sister</option>
        <option value="Other">Other</option>
    </select>

    <label>
        <input type="checkbox" id="is_family_head" style="width:auto">
        Is Family Head?
    </label>

    <h3>4. Education and Occupation</h3>

    <label>Education Level</label>
    <select id="education_level">
        <option value="">Select Education</option>
        <option value="Not Educated">Not Educated</option>
        <option value="Primary">Primary</option>
        <option value="Secondary">Secondary</option>
        <option value="Certificate">Certificate</option>
        <option value="Diploma">Diploma</option>
        <option value="Degree">Degree</option>
        <option value="Masters">Masters</option>
        <option value="PhD">PhD</option>
    </select>

    <label>Occupation</label>
    <input type="text" id="occupation">

    <h3>5. Emergency Contact</h3>

    <label>Contact Name</label>
    <input type="text" id="emergency_contact_name">

    <label>Contact Phone</label>
    <input type="tel" id="emergency_contact_phone">

    <label>Relationship</label>
    <input type="text" id="emergency_relationship">

    <h3>6. Membership Information</h3>

    <label>Department</label>
    <input type="text" id="department">

    <label>Registration Date *</label>
    <input type="date" id="registration_date" required>

    <button type="submit" id="saveMember">
        SAVE MEMBER
    </button>

    <p id="memberMessage"></p>

    <a href="dashboard.html">← Back to Dashboard</a>

</form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="members.js"></script>
</body>
</html>
