
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WGWLAD - Member Registration</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .member-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 24px;
        }

        .member-header {
            margin-bottom: 25px;
        }

        .member-header h1 {
            margin-bottom: 8px;
        }

        .member-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .member-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .member-field input,
        .member-field select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            width: 100%;
            box-sizing: border-box;
        }

        .member-section {
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }

        .member-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #saveMember {
            padding: 13px 25px;
            margin-top: 25px;
            cursor: pointer;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }

        #memberMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        @media(max-width: 650px) {
            .member-grid {
                grid-template-columns: 1fr;
            }

            .member-container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="member-container">

    <div class="member-header">
        <h1>WGWLAD</h1>
        <h2>Member Registration</h2>
        <p>Register a new church member</p>
        <a href="dashboard.html">← Back to Dashboard</a>
    </div>

    <form id="memberForm">

        <h3 class="member-section">1. Personal Information</h3>

        <div class="member-grid">

            <div class="member-field">
                <label>First Name *</label>
                <input type="text" id="first_name" required>
            </div>

            <div class="member-field">
                <label>Father Name *</label>
                <input type="text" id="father_name" required>
            </div>

            <div class="member-field">
                <label>Grandfather Name</label>
                <input type="text" id="grandfather_name">
            </div>

            <div class="member-field">
                <label>Gender *</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="member-field">
                <label>Birth Date</label>
                <input type="date" id="birth_date">
            </div>

            <div class="member-field">
                <label>Phone Number</label>
                <input type="tel" id="phone">
            </div>

            <div class="member-field">
                <label>Address</label>
                <input type="text" id="address">
            </div>

            <div class="member-field">
                <label>Marital Status</label>
                <select id="marital_status">
                    <option value="">Select Status</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Divorced">Divorced</option>
                    <option value="Widowed">Widowed</option>
                </select>
            </div>

        </div>

        <h3 class="member-section">2. Christian Life Information</h3>

        <div class="member-grid">

            <div class="member-field">
                <label>Accepted Christ Date</label>
                <input type="date" id="accepted_christ_date">
            </div>

            <div class="member-field">
                <label>Baptism Date</label>
                <input type="date" id="baptism_date">
            </div>

            <div class="member-field">
                <label>Education Level</label>
                <select id="education_level">
                    <option value="">Select Education</option>
                    <option value="No Formal Education">No Formal Education</option>
                    <option value="Primary">Primary</option>
                    <option value="Secondary">Secondary</option>
                    <option value="Certificate">Certificate</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Degree">Degree</option>
                    <option value="Postgraduate">Postgraduate</option>
                </select>
            </div>

            <div class="member-field">
                <label>Occupation</label>
                <input type="text" id="occupation">
            </div>

            <div class="member-field">
                <label>Department</label>
                <input type="text" id="department">
            </div>

        </div>

        <h3 class="member-section">3. Family Information</h3>

        <div class="member-grid">

            <div class="member-field">
                <label>Number of Children</label>
                <input type="number" id="number_of_children"
                       min="0" value="0">
            </div>

            <div class="member-field">
                <label>Relationship</label>
                <select id="relationship">
                    <option value="">Select Relationship</option>
                    <option value="Head">Head</option>
                    <option value="Spouse">Spouse</option>
                    <option value="Child">Child</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="member-field">
                <label>Registration Date *</label>
                <input type="date" id="registration_date" required>
            </div>

        </div>

        <p class="member-checkbox">
            <input type="checkbox" id="is_family_head">
            <label for="is_family_head">Is Family Head?</label>
        </p>

        <h3 class="member-section">4. Emergency Contact</h3>

        <div class="member-grid">

            <div class="member-field">
                <label>Emergency Contact Name</label>
                <input type="text" id="emergency_contact_name">
            </div>

            <div class="member-field">
                <label>Emergency Contact Phone</label>
                <input type="tel" id="emergency_contact_phone">
            </div>

        </div>

        <button type="submit" id="saveMember">
            SAVE MEMBER
        </button>

        <p id="memberMessage"></p>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="members.js"></script>

</body>
</html>
