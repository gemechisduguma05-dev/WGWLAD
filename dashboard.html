
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGWLAD Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="dashboard">
    <header class="topbar">
        <div>
            <h2>WGWLAD</h2>
            <p>Church Management System</p>
        </div>
        <button id="logoutButton">LOGOUT</button>
    </header>

    <section class="welcome">
        <h2>Welcome, <span id="userName">User</span></h2>
        <p id="userRole"></p>
    </section>

    <section class="cards">
        <div class="card">
            <h3>Members</h3>
            <p>Register and manage church members.</p>
            <a href="members.html">Open Members →</a>
        </div>

        <div class="card">
            <h3>Families</h3>
            <p>Manage family records.</p>
            <a href="families.html">Open Families →</a>
        </div>

        <div class="card">
            <h3>Users</h3>
            <p>Manage system users.</p>
            <a href="users.html">Manage Users →</a>
        </div>
    </section>

    <p id="dashboardMessage"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
